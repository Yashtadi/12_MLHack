<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PathSnap · Phase 1</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#182233;background:#f3f6fa}body{margin:0}.wrap{max-width:1100px;margin:36px auto;padding:0 20px}.card{background:white;border:1px solid #dce3ed;border-radius:14px;padding:22px;margin:16px 0;box-shadow:0 4px 16px #172b4d0d}h1{margin:0 0 6px}p{color:#59697d}button,select{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid #b7c3d2;background:white}button{background:#165dca;color:white;border:0;cursor:pointer;margin-left:8px}iframe{width:100%;height:600px;border:0;border-radius:10px}.metrics{display:flex;gap:18px;flex-wrap:wrap}.metric{background:#f3f7fd;padding:12px 16px;border-radius:8px}.muted{font-size:.9rem}
</style></head>
<body><main class="wrap"><section class="card"><h1>PathSnap</h1><p>Phase 1 · GPS map matching and route reconstruction · running locally on one laptop</p><label for="trip">Development trip </label><select id="trip"></select><button id="run">Predict route</button><div id="status" class="muted"></div></section><section id="result" class="card" hidden><h2>Prediction summary</h2><div id="metrics" class="metrics"></div><p class="muted">This demonstration uses the student-test partition for development metrics. Evaluator-only trips are not included.</p><iframe id="map"></iframe></section></main>
<script>
const $=id=>document.getElementById(id);async function loadTrips(){let r=await fetch('/api/trips'),j=await r.json();$('trip').innerHTML=j.trips.map(x=>`<option value="${x}">${x}</option>`).join('');if(!j.trips.length)$('status').textContent='No student-test data folder found. Set PATHSNAP_DATA.'}
$('run').onclick=async()=>{let id=$('trip').value;if(!id)return;$('status').textContent='Generating candidate roads and decoding route…';$('run').disabled=true;try{let r=await fetch(`/api/predict/${id}`,{method:'POST'}),j=await r.json();if(!r.ok)throw new Error(j.detail||'Prediction failed');$('metrics').innerHTML=[['Selected model',j.model],['Observations',j.observations.toLocaleString()],['Candidate miss rate',(100*j.candidate_miss_rate).toFixed(1)+'%'],['Classifier Top-1',(100*j.classifier_top1_accuracy).toFixed(1)+'%'],['After Viterbi',(100*j.viterbi_top1_accuracy).toFixed(1)+'%'],['Arc continuity: classifier',(100*j.classifier_direct_arc_continuity).toFixed(1)+'%'],['Arc continuity: Viterbi',(100*j.viterbi_direct_arc_continuity).toFixed(1)+'%']].map(([k,v])=>`<div class="metric"><b>${k}</b><br>${v}</div>`).join('');$('map').src=j.map_url+'?t='+Date.now();$('result').hidden=false;$('status').textContent=`Completed trip ${id}.`}catch(e){$('status').textContent=e.message}finally{$('run').disabled=false}};loadTrips();
</script></body></html>
