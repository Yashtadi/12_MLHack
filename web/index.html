<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PathSnap · Evaluation</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#182233;background:#f3f6fa}body{margin:0}.wrap{max-width:1100px;margin:36px auto;padding:0 20px}.card{background:white;border:1px solid #dce3ed;border-radius:14px;padding:22px;margin:16px 0;box-shadow:0 4px 16px #172b4d0d}h1{margin:0 0 6px}p{color:#59697d}button,select,input{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid #b7c3d2;background:white}button{background:#165dca;color:white;border:0;cursor:pointer;margin-left:8px}button:disabled{opacity:.6;cursor:wait}input{min-width:270px}iframe{width:100%;height:600px;border:0;border-radius:10px}.metrics{display:flex;gap:18px;flex-wrap:wrap}.metric{background:#f3f7fd;padding:12px 16px;border-radius:8px}.muted{font-size:.9rem}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
</style></head>
<body><main class="wrap"><section class="card"><h1>PathSnap</h1><p>Phase 2 · GPS map matching and route reconstruction</p><div class="row"><label for="apiBase">Laptop 1 API address</label><input id="apiBase" type="url" placeholder="http://192.168.1.25:8000"><button id="connect">Connect</button></div><div class="row"><label for="trip">Evaluator trip</label><select id="trip" disabled></select><button id="run" disabled>Evaluate trip</button></div><div id="status" class="muted">Enter the Laptop 1 API address, then connect.</div></section><section id="result" class="card" hidden><h2>Prediction and server-side evaluation</h2><div id="metrics" class="metrics"></div><p class="muted">The reference route remains on Laptop 1. The map displays observed GPS, candidate road context, and the predicted route.</p><iframe id="map" title="Predicted route map"></iframe></section></main>
<script>
const $=id=>document.getElementById(id);const stored=localStorage.getItem('pathsnap-api');const query=new URLSearchParams(location.search).get('api');const sameServer=['8000','8001','8002'].includes(location.port);$('apiBase').value=query||stored||(sameServer?location.origin:'');
function apiBase(){return $('apiBase').value.trim().replace(/\/$/,'')}function apiUrl(path){return apiBase()+path}
async function loadTrips(){const base=apiBase();if(!base){$('status').textContent='Enter Laptop 1 API address, for example http://192.168.1.25:8000';return}try{let r=await fetch(apiUrl('/api/trips'));if(!r.ok)throw new Error('API returned '+r.status);let j=await r.json();$('trip').innerHTML=j.trips.map(x=>`<option value="${x}">${x}</option>`).join('');$('trip').disabled=!j.trips.length;$('run').disabled=!j.trips.length;$('status').textContent=j.trips.length?`Connected. ${j.trips.length} evaluator trips are available.`:'Connected, but the API did not find evaluator trips.';localStorage.setItem('pathsnap-api',base)}catch(e){$('status').textContent=`Could not connect to ${base}. Check both laptops are on the same network and Laptop 1 allows port 8000. (${e.message})`}}
$('connect').onclick=loadTrips;$('run').onclick=async()=>{let id=$('trip').value;if(!id)return;$('status').textContent='Generating candidates, decoding route, and calculating server-side metrics…';$('run').disabled=true;try{let r=await fetch(apiUrl(`/api/predict/${id}`),{method:'POST'}),j=await r.json();if(!r.ok)throw new Error(j.detail||'Prediction failed');$('metrics').innerHTML=[['Model',j.model],['Observations',Number(j.observations).toLocaleString()],['Candidate miss rate',pct(j.candidate_miss_rate)],['Classifier Top-1',pct(j.classifier_top1_accuracy)],['After Viterbi',pct(j.viterbi_top1_accuracy)],['Arc continuity: classifier',pct(j.classifier_direct_arc_continuity)],['Arc continuity: Viterbi',pct(j.viterbi_direct_arc_continuity)]].map(([k,v])=>`<div class="metric"><b>${k}</b><br>${v}</div>`).join('');$('map').src=apiUrl(j.map_url)+'?t='+Date.now();$('result').hidden=false;$('status').textContent=`Completed evaluator trip ${id}. Ground-truth labels stayed on Laptop 1.`}catch(e){$('status').textContent=e.message}finally{$('run').disabled=false}};function pct(x){return x==null?'N/A':(100*x).toFixed(1)+'%'}if($('apiBase').value)loadTrips();
</script></body></html>
